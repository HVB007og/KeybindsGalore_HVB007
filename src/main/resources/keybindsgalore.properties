# Keybinds Galore Configuration File

# --- General ---
# Enable debug logging to the console/log file.
DEBUG=false
# Enable verbose debug logging specifically for rendering operations.
VERBOSE_DEBUG=false

# --- Performance ---
# How many vertices to use for the pie menu circle. Higher is smoother.
CIRCLE_VERTICES=120
# Darken the background when the menu is open.
DARKENED_BACKGROUND=true
# How much to darken the background, as an alpha value. 0 = no darkening, 255 = solid black.
DARKENED_BACKGROUND_STRENGTH=0x60
# Render a shadow behind the text labels in the menu.
LABEL_TEXT_SHADOW=false

# --- Behaviour ---
# Use the circular pie menu instead of the list menu.
USE_CIRCULAR_MENU=true
# How many ticks the chosen action is held down after a menu selection.
PULSE_TIMER_DURATION=5
# Categories that fall back to "prioritise the whole category" when no exact
# action:key priority is configured. Matches a category id or its English label.
PRIORITY_CATEGORIES=[Movement]
# Exact action priorities, stored as actionId:physicalKey.
# An entry here always wins over PRIORITY_CATEGORIES for that physical key.
PRIORITY_KEYBINDS=[key.forward:key.keyboard.w, key.left:key.keyboard.a, key.back:key.keyboard.s, key.right:key.keyboard.d, key.jump:key.keyboard.space, key.sneak:key.keyboard.left.shift, key.sprint:key.keyboard.left.control, key.attack:key.mouse.left]
# Show warnings in chat when a key has conflicts.
SHOW_CONFLICT_WARNINGS=true
# A workaround for the attack keybind to prevent cooldown issues.
ENABLE_ATTACK_WORKAROUND=true
# A list of categories to exclude from conflict detection. Matching is exact and
# case-insensitive against either the category id (for example minecraft:movement)
# or its English label. The 26.2 labels are: Creative Mode, Gameplay, Inventory,
# Miscellaneous, Movement, Multiplayer, Spectator, Game Interface.
# "Debug" is a legacy value from 1.21.7 and no longer matches any 26.2 category.
FILTERED_CATEGORY_KEYS=[]

# --- Pie Menu Customisation ---
# How much the selected sector should expand. (Currently not implemented)
EXPANSION_FACTOR_WHEN_SELECTED=0.06
# Margin in pixels between the pie menu and the screen edge.
PIE_MENU_MARGIN=0
# Pie radius as a fraction of half the shorter screen dimension, after the margin.
# 0.8 is the size this mod has always drawn at; lower values shrink the pie.
PIE_MENU_SCALE=0.8
# Radius of the central "cancel" zone as a fraction of the pie radius.
CANCEL_ZONE_SCALE=0.2
# Background color of the pie menu sectors in ARGB hex format.
PIE_MENU_COLOR=0x40404040
# Color of the highlighted (hovered) sector in ARGB hex format.
PIE_MENU_HIGHLIGHT_COLOR=0x40EED202

# Colors of the pie menu sectors in ARGB hex format. Even and odd wedges are
# listed separately, so there is no "lighten the alternates" option.
PIE_MENU_SECTOR_COLOR_EVEN=0xC0606060
PIE_MENU_SECTOR_COLOR_ODD=0xC0808080
PIE_MENU_SECTOR_COLOR_SELECTED=0xC0E0E0E0
PIE_MENU_SECTOR_COLOR_LAST_ODD=0xC0A0A0A0
PIE_MENU_CANCEL_ZONE_COLOR=0xC0000000
PIE_MENU_CANCEL_ZONE_HOVER_COLOR=0xC0B04232

# Opacity of the list menu. 0 is invisible, 255 is opaque.
PIE_MENU_ALPHA=0x40
# Shade each wedge from a lighter inner edge to its outer colour.
SECTOR_GRADATION=true
# How strong that shading is, as a percentage toward white. 0 is flat.
GRADATION_INTENSITY=12
# Animate the pie menu opening.
ANIMATE_PIE_MENU=true
# Length of the opening animation in milliseconds. 0 appears instantly.
ANIMATION_DURATION=180

# TODO(P0): Give VERBOSE_DEBUG a distinct behavior or document it as an alias of DEBUG.

# Retired keys, stripped from existing config files automatically on load:
#   PIE_MENU_COLOR_LIGHTEN_FACTOR  superseded by PIE_MENU_SECTOR_COLOR_ODD
#   PIE_MENU_SELECT_COLOR          superseded by PIE_MENU_SECTOR_COLOR_SELECTED
#   PIE_MENU_BLEND                 duplicated the per-sector colours
#   LABEL_TEXT_INSET               labels now sit a fixed distance outside the pie
#   IGNORED_KEYS                   priority keys achieve the same thing
#   INVERT_IGNORED_KEYS_LIST       priority keys achieve the same thing
#   USE_SOFTWARE_RENDERING         1.21.x flag, lost meaning when RingRenderer arrived
#   LAZY_CONFLICT_CHECK            conflicts now refresh on every relevant trigger
#   USE_KEYBIND_FIX                1.21.x fix, the code it referred to is gone
