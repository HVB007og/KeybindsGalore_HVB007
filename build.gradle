plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        keybindsgalore {
            sourceSet sourceSets.main
        }
    }

    // MinecraftConflictIndexTest constructs real KeyMapping instances, so the
    // test source set needs the modding dependencies too, not just pure-Java.
    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes(
                'Implementation-Title': project.base.archivesName.get(),
                'Implementation-Version': project.version
        )
    }
}

// NeoForge reads the mod version from neoforge.mods.toml, and there is no manifest to fall
// back on in a dev run, so the literal there must track gradle.properties. A stale value
// shows up in-game as the wrong version, which is easy to miss.
def modsToml = file('src/main/resources/META-INF/neoforge.mods.toml')
tasks.register('verifyModVersion') {
    inputs.file(modsToml)
    doLast {
        def match = (modsToml.text =~ /(?m)^version\s*=\s*"([^"]+)"/)
        if (!match) {
            throw new GradleException("No version found in ${modsToml}")
        }
        if (match[0][1] != project.version.toString()) {
            throw new GradleException(
                    "Version mismatch: neoforge.mods.toml says '${match[0][1]}' " +
                    "but gradle.properties says '${project.version}'. Update the toml.")
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyModVersion')
}
