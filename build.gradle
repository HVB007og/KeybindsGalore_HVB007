plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        keybindsgalore {
            sourceSet sourceSets.main
        }
    }

    // MinecraftConflictIndexTest constructs real KeyMapping instances, so the
    // test source set needs the modding dependencies too, not just pure-Java.
    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
    // ModDevGradle marks build/classes and its subdirectories read-only, and Gradle then fails
    // with "Failed to clean up stale outputs" because it cannot delete a read-only directory. The
    // fix used to be a manual `attrib -R build\* /S /D` before every build, which only worked
    // for command-line builds: anything launched from the IDE, including runClient, never ran
    // it and failed instead. Clearing the attribute as part of the build removes that whole
    // class of failure, since the step can no longer be forgotten. Windows-only, because the
    // attribute does not exist elsewhere and the exec would be meaningless.
    //
    // The /D flag matters: without it only files are cleared and the directories stay
    // read-only, which is exactly the state that produced the failure.
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        doFirst {
            def buildDir = layout.buildDirectory.get().asFile
            if (buildDir.isDirectory()) {
                def process = ["attrib", "-R", "${buildDir.absolutePath}\\*", "/S", "/D"].execute()
                process.waitFor()
            }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes(
                'Implementation-Title': project.base.archivesName.get(),
                'Implementation-Version': project.version
        )
    }
}

// NeoForge reads the mod version from neoforge.mods.toml, and there is no manifest to fall
// back on in a dev run, so the literal there must track gradle.properties. A stale value
// shows up in-game as the wrong version, which is easy to miss.
def modsToml = file('src/main/resources/META-INF/neoforge.mods.toml')
tasks.register('verifyModVersion') {
    inputs.file(modsToml)
    doLast {
        def match = (modsToml.text =~ /(?m)^version\s*=\s*"([^"]+)"/)
        if (!match) {
            throw new GradleException("No version found in ${modsToml}")
        }
        if (match[0][1] != project.version.toString()) {
            throw new GradleException(
                    "Version mismatch: neoforge.mods.toml says '${match[0][1]}' " +
                    "but gradle.properties says '${project.version}'. Update the toml.")
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyModVersion')
}
