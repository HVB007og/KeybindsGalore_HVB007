plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.terraformersmc.com/" }
}

loom {
	runs {
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=keybindsgalore"
			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += ['src/main/generated']
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	// Loom marks build/classes and its subdirectories read-only, and Gradle then fails with
	// "Failed to clean up stale outputs" because it cannot delete a read-only directory. The
	// fix used to be a manual `attrib -R build\* /S /D` before every build, which only worked
	// for command-line builds: anything launched from the IDE, including runClient, never ran
	// it and failed instead. Clearing the attribute as part of the build removes that whole
	// class of failure, since the step can no longer be forgotten. Windows-only, because the
	// attribute does not exist elsewhere and the exec would be meaningless.
	//
	// The /D flag matters: without it only files are cleared and the directories stay
	// read-only, which is exactly the state that produced the failure.
	if (System.getProperty("os.name").toLowerCase().contains("windows")) {
		doFirst {
			def buildDir = layout.buildDirectory.get().asFile
			if (buildDir.isDirectory()) {
				def process = ["attrib", "-R", "${buildDir.absolutePath}\\*", "/S", "/D"].execute()
				process.waitFor()
			}
		}
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add publishing target if needed (e.g., Modrinth/Maven/etc)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}