plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.71'
}

version = '1.6.1'
group = 'net.hvb007'

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // NeoForge 1.21.1 versions start with 21.1.x
    version = '21.1.75'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'keybindsgalore'
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'keybindsgalore'
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'keybindsgalore', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        keybindsgalore {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://jitpack.io" } 
}

dependencies {
    // Add any dependencies here if needed in the future
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}